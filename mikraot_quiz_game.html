<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>משחק שאלות — מאגר המקור</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,"Noto Sans Hebrew",sans-serif;background:linear-gradient(135deg,#111827,#312e81);color:#fff;display:flex;justify-content:center}
.app{width:min(760px,100%);padding:20px 14px 32px}
header{text-align:center;margin-bottom:16px}
h1{margin:4px 0 6px;font-size:clamp(24px,6vw,38px)}
.sub{opacity:.82;font-size:14px}
.panel{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:24px;padding:16px;backdrop-filter:blur(10px)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px;font-size:14px}
.progress{height:8px;background:rgba(255,255,255,.16);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar{height:100%;width:0%;background:#fff;transition:width .25s}
.card{background:#fff;color:#111827;border-radius:22px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.q{font-size:clamp(20px,5vw,29px);font-weight:700;line-height:1.45;margin-bottom:20px}
.answers{display:grid;gap:11px}
button{font:inherit;border:0;cursor:pointer}
.answer{width:100%;text-align:right;background:#eef2ff;color:#111827;border-radius:15px;padding:15px 16px;font-size:17px;line-height:1.45;border:2px solid transparent;transition:.15s}
.answer:hover:not(:disabled){transform:translateY(-1px);background:#e0e7ff}
.answer.correct{background:#dcfce7;border-color:#16a34a}
.answer.wrong{background:#fee2e2;border-color:#dc2626}
.answer:disabled{cursor:default}
.feedback{min-height:30px;margin-top:16px;font-weight:700;font-size:16px}
.next{margin-top:14px;width:100%;padding:14px;border-radius:14px;background:#111827;color:#fff;font-weight:700;display:none}
.next.show{display:block}
.controls{display:flex;gap:10px;margin-top:14px}
.control{flex:1;padding:12px;border-radius:13px;background:rgba(255,255,255,.13);color:#fff;border:1px solid rgba(255,255,255,.2)}
.start{display:flex;flex-direction:column;gap:12px;text-align:center;padding:28px 10px}
.start button{padding:15px 18px;border-radius:14px;background:#fff;color:#111827;font-weight:700;font-size:17px}
.result{text-align:center;padding:28px 10px}
.score{font-size:44px;font-weight:800;margin:8px}
.small{opacity:.75;font-size:13px}
@media (max-width:520px){.app{padding:12px 10px 24px}.card{padding:18px}.answer{font-size:16px}}
</style>
</head>
<body>
<div class="app">
<header>
<h1>🃏 משחק השאלות</h1>
<div class="sub">529 שאלות מתוך המאגר המקורי בלבד</div>
</header>

<div class="panel">
  <div id="start" class="start">
    <div>בכל משחק סדר השאלות אקראי.</div>
    <div class="small">לא נוספו ולא הוסרו שאלות, תשובות או אפשרויות מהמאגר.</div>
    <button onclick="startGame()">התחל משחק</button>
  </div>

  <div id="game" style="display:none">
    <div class="top">
      <span id="counter"></span>
      <span id="score"></span>
    </div>
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div class="card">
      <div id="question" class="q"></div>
      <div id="answers" class="answers"></div>
      <div id="feedback" class="feedback"></div>
      <button id="next" class="next" onclick="nextQuestion()">שאלה הבאה</button>
    </div>
    <div class="controls">
      <button class="control" onclick="newGame()">משחק חדש — ערבוב מחדש</button>
    </div>
  </div>

  <div id="result" class="result" style="display:none">
    <div>סיימת את כל השאלות 🎉</div>
    <div id="finalScore" class="score"></div>
    <div class="small">לחיצה על הכפתור תיצור משחק חדש עם סדר שאלות אקראי.</div>
    <div style="margin-top:18px"><button class="start" style="background:#fff;color:#111827;border-radius:14px;font-weight:700" onclick="newGame()">משחק חדש</button></div>
  </div>
</div>
</div>

<script>
const QUESTIONS = [{"question": "?מה תפקיד הקואליציה", "options": [{"text": "להוות איזון ובלימה לממשלה", "correct": false}, {"text": "לגבות בכנסת את צעדי הממשלה ולהגן על חקיקותיה", "correct": true}, {"text": "להציע לציבור אלטרנטיבה שלטונית ולבקר את פעילות הממשלה", "correct": false}, {"text": "לספק סעד לאזרח או לגופים הנדרשים לו", "correct": false}]}, {"question": "חוק קובע כי לכל יהודי הזכות לעלות ארצה ולקבל ?אזרחות ישראלית ללא תנאי", "options": [{"text": "חוק השיבה לארץ ישראל", "correct": false}, {"text": "חוק האזרחות", "correct": false}, {"text": "חוק השבות", "correct": true}, {"text": "חוק יסוד כבוד האדם וחירותו", "correct": false}]}, {"question": "?איזו אוכלוסיה צורפה לחוק השבות לאחר תיקופו", "options": [{"text": "יהודים מהעליה הראשונה והשניה", "correct": false}, {"text": "ילדיהם ונכדיהם של יהודים", "correct": true}, {"text": "גויים המעוניינים להתגייר ולעלות ארצה", "correct": false}, {"text": "בני מיעוטים המעוניינים לחיות בשטחי הארץ", "correct": false}]}, {"question": "?איזו מילה לא נמצאת בתוך מגילת העצמאות", "options": [{"text": "ציונית", "correct": false}, {"text": "שואה", "correct": false}, {"text": "יהודית", "correct": false}, {"text": "דמוקרטית", "correct": true}]}, {"question": "?איזו תנועה או מפלגה הנהיג דויד וולפסון", "options": [{"text": "אגודת ישראל", "correct": false}, {"text": "מפלגת בית''ר", "correct": false}, {"text": "התנועה הציונית", "correct": true}, {"text": "ההסתדרות הכללית", "correct": false}]}, {"question": "מערכות ניתן למצוא באופייה הדמוקרטי של כל ?מדינה", "options": [{"text": "מערכת חינוך- ערכית, מערכת משפטית- מוסדית", "correct": false}, {"text": "מערכת חינוך- מוסדית, מערכת משפטית- ערכית", "correct": false}, {"text": "מערכת פורמלית- מוסדית, מערכת תרבותית- ערכית", "correct": true}, {"text": "מערכת פורמאלית- ערכית, מערכת תרבותית- מוסדית", "correct": false}]}, {"question": "אילו אירועים התרחשו בעקבות חקיקת חוק יסוד'' ?''ירושלים בירת ישראל", "options": [{"text": "פותחו מוסדות כלכליים, חינוכיים ומסחריים רבים בירושלים", "correct": false}, {"text": "פותחו מוסדות כלכליים, חינוכיים ודתיים רבים בירושלים", "correct": false}, {"text": "שגריריות העבירו את מקום מושבן מתל אביב לירושלים", "correct": false}, {"text": "שגריריות העבירו את מקום מושבן מירושלים לתל אביב", "correct": true}]}, {"question": "אילו מקצועות מוגדים ''לימוד חובה'' עפ''י הגדרת ?הסוכנות היהודית במסמך הסטטוס קוו", "options": [{"text": "היסטוריה, שיטת מחקר, עברית", "correct": false}, {"text": "גיאוגרפיה, היסטוריה ועברית", "correct": false}, {"text": "מורשת, עברית, היסטוריה", "correct": false}, {"text": "עברית, היסטוריה ומדעים", "correct": true}]}, {"question": "באיזו שנה החל מבקר המדינה לשמש כנציב תלונות ?הציבור", "options": [{"text": "1976", "correct": false}, {"text": "1972", "correct": false}, {"text": "1971", "correct": true}, {"text": "1974", "correct": false}]}, {"question": "?באיזו שנה נוסד בנק ישראל", "options": [{"text": "1950", "correct": false}, {"text": "1954", "correct": true}, {"text": "1956", "correct": false}, {"text": "1952", "correct": false}]}, {"question": "?באיזה שנה נכתב ההמנון", "options": [{"text": "1887", "correct": false}, {"text": "1933", "correct": false}, {"text": "1878", "correct": true}, {"text": "1947", "correct": false}]}, {"question": "?באילו מקרים מחוייב החייל לסרב פקודה", "options": [{"text": "כאשר הפקודה קשה לביצוע ונאלצים לערב גורם בכיר", "correct": false}, {"text": "כאשר הפקודה ניתנה לא ממפקדו הישיר", "correct": false}, {"text": "כאשר הפקודה בלתי חוקית", "correct": false}, {"text": "כאשר הפקודה עשויה לפגוע בחייו של אדם במישירין", "correct": true}]}, {"question": "?באילו ערים ישנה תחבורה ציבורית בשבת", "options": [{"text": "נהריה ואילת", "correct": false}, {"text": "ירושלים וחיפה", "correct": false}, {"text": "תל אביב וירושלים", "correct": false}, {"text": "חיפה ואילת", "correct": true}]}, {"question": "איזה אירוע הוגדר המושג ''פקודה בלתי חוקית ?''בעליל", "options": [{"text": "מלחמת ששת הימים", "correct": false}, {"text": "מלחמת העצמאות", "correct": false}, {"text": "אירועי יום האדמה", "correct": false}, {"text": let deck=[], index=0, points=0, answered=false;

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function startGame(){
  deck = QUESTIONS.map(q => ({question:q.question, options:q.options.map(o=>({...o}))}));
  shuffle(deck);
  index=0; points=0;
  document.getElementById('start').style.display='none';
  document.getElementById('result').style.display='none';
  document.getElementById('game').style.display='block';
  render();
}

function newGame(){
  startGame();
  window.scrollTo({top:0,behavior:'smooth'});
}

function render(){
  answered=false;
  const q=deck[index];
  document.getElementById('counter').textContent = `שאלה ${index+1} מתוך ${deck.length}`;
  document.getElementById('score').textContent = `נכון: ${points}`;
  document.getElementById('bar').style.width = `${(index/deck.length)*100}%`;
  document.getElementById('question').textContent=q.question;
  const box=document.getElementById('answers');
  box.innerHTML='';
  document.getElementById('feedback').textContent='';
  document.getElementById('next').classList.remove('show');

  q.options.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='answer';
    b.textContent=`${String.fromCharCode(65+i)}. ${o.text}`;
    b.onclick=()=>choose(i,b);
    box.appendChild(b);
  });
}

function choose(i,clicked){
  if(answered) return;
  answered=true;
  const q=deck[index];
  const buttons=[...document.querySelectorAll('.answer')];
  buttons.forEach((b,n)=>{
    b.disabled=true;
    if(q.options[n].correct) b.classList.add('correct');
  });
  if(q.options[i].correct){
    points++;
    document.getElementById('feedback').textContent='✓ תשובה נכונה';
  }else{
    clicked.classList.add('wrong');
    document.getElementById('feedback').textContent='✗ תשובה שגויה';
  }
  document.getElementById('score').textContent=`נכון: ${points}`;
  document.getElementById('next').classList.add('show');
}

function nextQuestion(){
  if(index < deck.length-1){
    index++;
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  }else{
    document.getElementById('game').style.display='none';
    document.getElementById('result').style.display='block';
    document.getElementById('finalScore').textContent=`${points} / ${deck.length}`;
  }
}
</script>
